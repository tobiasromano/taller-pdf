<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
</head><body style="margin:0">
<title>Taller PDF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: tool strip on top, page list on the left, a grey "desk" where pages sit like paper; a status line at the bottom. */
:root {
  --bg: #eceef2;
  --panel: #ffffff;
  --line: #d4d8df;
  --fg: #1b1f27;
  --muted: #5b6372;
  --accent: #b4232c;
  --accent-soft: #f6e3e4;
  --accent-fg: #ffffff;
  --desk: #d9dce2;
  --hover: #f1f3f6;
  --shadow: 0 1px 2px rgba(20,24,33,.12), 0 4px 14px rgba(20,24,33,.10);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --panel: #1d2027; --line: #2f343e; --fg: #e6e8ec; --muted: #9aa1ad;
    --accent: #f0656b; --accent-soft: #3a2124; --accent-fg: #1b0b0c; --desk: #0e1014; --hover: #262a33;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --panel: #1d2027; --line: #2f343e; --fg: #e6e8ec; --muted: #9aa1ad;
  --accent: #f0656b; --accent-soft: #3a2124; --accent-fg: #1b0b0c; --desk: #0e1014; --hover: #262a33;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.45);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top {
  display: flex; align-items: center; gap: 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.brand { font-weight: 600; letter-spacing: -.01em; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand svg { color: var(--accent); }
.bar { display: flex; align-items: center; gap: 4px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: thin; padding-block: 2px; }
.sep { width: 1px; height: 24px; background: var(--line); margin-inline: 6px; flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding-inline: 10px; border-radius: 6px;
  border: 1px solid transparent; background: transparent; white-space: nowrap; flex: none;
}
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .4; cursor: default; background: transparent; }
.btn.icon { width: 34px; padding: 0; justify-content: center; }
.btn.on { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); font-weight: 500; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }
.btn.ghost { border-color: var(--line); }
.btn svg { width: 18px; height: 18px; flex: none; }
.zoomv { font-family: var(--mono); font-size: 12px; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

/* props row */
.props {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 44px; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.props .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.props .grp { display: flex; align-items: center; gap: 8px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--fg); }
.cpick { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }
.props input[type=range] { width: 120px; accent-color: var(--accent); }
.props .val { font-family: var(--mono); font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 13px; }

/* main */
.main { flex: 1; display: flex; min-height: 0; position: relative; }
.side {
  width: 176px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px; padding: 14px 12px;
}
.thumb { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.thumb .tc {
  border: 2px solid transparent; border-radius: 4px; padding: 0; background: transparent; line-height: 0;
}
.thumb .tc canvas { box-shadow: var(--shadow); background: #fff; display: block; max-width: 140px; }
.thumb.cur .tc { border-color: var(--accent); }
.thumb .row { display: flex; align-items: center; gap: 2px; }
.thumb .n { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 22px; text-align: center; }
.mini { width: 26px; height: 26px; border-radius: 5px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.mini:hover { background: var(--hover); color: var(--fg); }
.mini:disabled { opacity: .3; background: transparent; cursor: default; }
.mini svg { width: 15px; height: 15px; }
.side .add { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.side .add .btn { justify-content: flex-start; font-size: 13px; }

.desk { flex: 1; overflow: auto; background: var(--desk); position: relative; min-width: 0; }
.pages { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px 24px 64px; min-width: max-content; }
.page { position: relative; background: #fff; box-shadow: var(--shadow); flex: none; }
.page canvas.pc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.page svg.ov { position: absolute; inset: 0; overflow: visible; }
.page .pnum { position: absolute; left: 100%; top: 0; margin-left: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.ov .a { cursor: inherit; }
.ov .hl { mix-blend-mode: multiply; }
.ov .selbox { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; pointer-events: none; }
.t-select .ov [data-aid] { cursor: move; }
.t-text .ov { cursor: text; }
.ov .cand { fill: transparent; stroke: color-mix(in srgb, var(--accent) 45%, transparent); stroke-width: 1; stroke-dasharray: 3 3; cursor: text; }
.ov .cand:hover { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); stroke-dasharray: none; }
.t-edit .ov [data-orig] { cursor: text; }
.t-edit .ov [data-aid]:not([data-orig]), .t-edit .ov [data-aid]:not([data-orig]) * { pointer-events: none; }
textarea.ed.ghost { color: transparent !important; caret-color: var(--accent); background: transparent; }
.fontchip { font-family: var(--mono); font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--hover); border: 1px solid var(--line); }
.warn { font-size: 12px; color: var(--muted); max-width: 46ch; }
.t-pen .ov, .t-hl .ov, .t-rect .ov, .t-white .ov { cursor: crosshair; }
textarea.ed {
  position: absolute; margin: 0; padding: 0; border: 1px dashed var(--accent); background: rgba(255,255,255,.85);
  font-family: Helvetica, Arial, sans-serif; resize: none; overflow: hidden; outline: none; white-space: pre; z-index: 5;
}

.drop {
  position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--accent-soft) 80%, transparent);
  display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 500; color: var(--accent); pointer-events: none; z-index: 20;
}

.status {
  display: flex; gap: 16px; align-items: center; background: var(--panel); border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  white-space: nowrap; overflow: hidden;
}
.cleanopt { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--fg); cursor: pointer; flex-shrink: 0; }
.cleanopt input { accent-color: var(--accent); margin: 0; }
.status .file { color: var(--fg); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; z-index: 50; box-shadow: var(--shadow);
  max-width: calc(100% - 32px);
}
.dlbox { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10,12,16,.45); }
[hidden] { display: none !important; }
.dlcard { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; width: 100%; max-width: 380px; }
.dlcard h2 { margin: 0 0 6px; font-size: 16px; }
.dlcard p { margin: 0 0 16px; font-size: 13px; color: var(--muted); line-height: 1.45; word-break: break-word; }
.dlcard .row { display: flex; gap: 8px; flex-wrap: wrap; }
.dlcard a.btn { text-decoration: none; }
.dlcard .close { margin-top: 12px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.pagesbtn { display: none; }

@media (max-width: 760px) {
  .brand span { display: none; }
  .side { position: absolute; z-index: 15; top: 0; bottom: 0; left: 0; box-shadow: var(--shadow); }
  .side:not(.open) { display: none; }
  .pagesbtn { display: inline-flex; }
  .pages { padding: 16px 16px 64px; }
  .status .opt { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 2.8h8.5L19 7.3V21.2H6z"/><path d="M14.5 2.8v4.5H19"/><path d="M9 16.5l5.5-5.5 1.6 1.6-5.5 5.5H9z" fill="currentColor" stroke="none"/></svg>
    <span>Taller PDF</span>
  </div>
  <div class="bar" id="bar">
    <button class="btn icon pagesbtn" id="bPages" title="Páginas" aria-label="Mostrar páginas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="7" height="8" rx="1"/><rect x="13" y="3" width="7" height="8" rx="1"/><rect x="4" y="13" width="7" height="8" rx="1"/><rect x="13" y="13" width="7" height="8" rx="1"/></svg></button>
    <button class="btn ghost" id="bOpen" title="Abrir un PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7.5V19h18V9H11.5L9.5 6.5H3z"/></svg>Abrir</button>
    <div class="sep"></div>
    <button class="btn icon tool" data-tool="select" title="Seleccionar y mover (V)" aria-label="Seleccionar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3.5l13 7.2-5.8 1.4 3.3 6-2.4 1.3-3.3-6L5.6 17z"/></svg></button>
    <button class="btn tool" data-tool="edit" title="Editar el texto del PDF (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18L8 6l4.5 12M5.2 14h5.6"/><path d="M14 20l.6-3 5-5 2.4 2.4-5 5z"/></svg>Editar texto</button>
    <button class="btn icon tool" data-tool="text" title="Agregar texto nuevo (T)" aria-label="Texto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4.5h14V6M12 4.5v15M9 19.5h6"/></svg></button>
    <button class="btn icon tool" data-tool="pen" title="Dibujar / firmar (P)" aria-label="Dibujar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 013 3L8 18.5z"/><path d="M13.5 7l3 3"/></svg></button>
    <button class="btn icon tool" data-tool="hl" title="Resaltar (H)" aria-label="Resaltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 14l-2.5 2.5V19h2.5L11.5 16.5"/><path d="M9 14l7.5-9.5 3 3L11.5 16.5z"/><path d="M3 21.5h18" stroke-width="2.4" opacity=".55"/></svg></button>
    <button class="btn icon tool" data-tool="rect" title="Rectángulo (R)" aria-label="Rectángulo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button class="btn icon tool" data-tool="white" title="Tapar con blanco (W)" aria-label="Tapar con blanco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16M4 12h10M4 16h16" opacity=".45"/><rect x="9" y="9.5" width="11" height="5" rx="1" fill="var(--panel)"/></svg></button>
    <button class="btn icon" id="bImg" title="Insertar imagen (I)" aria-label="Insertar imagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M4 18l5.5-5 4 3.5 2.5-2 4 3.5"/></svg></button>
    <div class="sep"></div>
    <button class="btn icon" id="bUndo" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4.5 11.5 9 16"/><path d="M5 11.5h9.5a5 5 0 010 10H12"/></svg></button>
    <button class="btn icon" id="bRedo" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7l4.5 4.5L15 16"/><path d="M19 11.5H9.5a5 5 0 000 10H12"/></svg></button>
    <div class="sep"></div>
    <button class="btn icon" id="bZo" title="Alejar" aria-label="Alejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
    <button class="btn zoomv" id="bFit" title="Ajustar al ancho">100 %</button>
    <button class="btn icon" id="bZi" title="Acercar" aria-label="Acercar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
  </div>
  <button class="btn primary" id="bSave" title="Descargar el PDF editado"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"/></svg>Descargar</button>
</header>

<div class="props" id="props"></div>

<div class="main">
  <aside class="side" id="side">
    <div id="thumbs" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="add">
      <button class="btn ghost" id="bBlank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18H6z"/><path d="M12 9v6M9 12h6"/></svg>Página en blanco</button>
      <button class="btn ghost" id="bMerge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 3h9l3 3v12H8z"/><path d="M4 7v14h11"/></svg>Añadir otro PDF</button>
    </div>
  </aside>
  <section class="desk" id="desk">
    <div class="pages" id="pages"></div>
    <div class="loading" id="loading">Preparando documento…</div>
    <div class="drop" id="drop" hidden>Soltá un PDF para abrirlo o una imagen para insertarla</div>
  </section>
</div>

<footer class="status">
  <span class="file" id="sFile">—</span>
  <span id="sPage">—</span>
  <span class="opt" id="sSize">—</span>
  <label class="cleanopt" title="Al descargar, borra del archivo el texto que no se ve: el original de lo que editaste, el que tapaste con «Tapar» y el texto oculto del PDF">
    <input type="checkbox" id="cClean" checked> Quitar texto invisible
  </label>
</footer>

<div class="toast" id="toast" hidden></div>
<div class="dlbox" id="dlBox" hidden role="dialog" aria-modal="true" aria-labelledby="dlTitle">
  <div class="dlcard">
    <h2 id="dlTitle">Tu PDF está listo</h2>
    <p id="dlName"></p>
    <div class="row">
      <a class="btn primary" id="dlLink">Guardar PDF</a>
      <a class="btn" id="dlOpen" target="_blank" rel="noopener">Abrir en otra pestaña</a>
    </div>
    <button class="close" id="dlClose">Cerrar</button>
  </div>
</div>
<input type="file" id="fOpen" accept="application/pdf,.pdf" hidden>
<input type="file" id="fMerge" accept="application/pdf,.pdf" hidden>
<input type="file" id="fImg" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script>
(() => {
'use strict';
const { PDFDocument, rgb, degrees, StandardFonts, BlendMode, LineCapStyle, PDFName, PDFArray, PDFRawStream, decodePDFRawStream } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
let uid = 1;
const nid = () => 'a' + (uid++) + Math.random().toString(36).slice(2, 6);

const S = {
  sources: [], proxies: {}, pages: [], imgs: {},
  tool: 'select',
  colors: { text: '#1b1f27', pen: '#1f3fa8', hl: '#ffd43b', rect: '#b4232c' },
  fontSize: 14, stroke: 2.5,
  zoom: 'fit', scale: 1,
  sel: null, name: 'propuesta-ejemplo.pdf',
  undo: [], redo: [], cur: 0, clean: true
};
const RT = {};
const SWATCHES = ['#1b1f27', '#b4232c', '#1f3fa8', '#17803d', '#ffd43b', '#ff8fc7', '#7cd3ff'];

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rotOf = p => (p.base + p.rot) % 360;
const proxy = p => S.proxies[p.src + ':' + p.idx];
const viewport = (p, scale) => proxy(p).getViewport({ scale, rotation: rotOf(p) });
const pageById = id => S.pages.find(p => p.id === id);
const snap = () => JSON.stringify(S.pages);
function mk(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); }
function readFile(file, as) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; as === 'url' ? r.readAsDataURL(file) : r.readAsArrayBuffer(file); }); }
function loadImg(url) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
function dataUrlBytes(u) { const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }

/* ---------- history ---------- */
function commit(before) { S.undo.push(before); if (S.undo.length > 100) S.undo.shift(); S.redo = []; updateButtons(); }
function undo() { if (!S.undo.length) return; commitEditor(); S.redo.push(snap()); S.pages = JSON.parse(S.undo.pop()); S.sel = null; renderAll(); }
function redo() { if (!S.redo.length) return; commitEditor(); S.undo.push(snap()); S.pages = JSON.parse(S.redo.pop()); S.sel = null; renderAll(); }

/* ---------- loading documents ---------- */
async function addSource(bytes) {
  const doc = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false, useSystemFonts: true, fontExtraProperties: true }).promise;
  const src = S.sources.length;
  S.sources.push({ bytes, doc });
  const out = [];
  for (let i = 0; i < doc.numPages; i++) {

document.querySelectorAll('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#bOpen').onclick = () => $('#fOpen').click();
$('#bMerge').onclick = () => $('#fMerge').click();
$('#bImg').onclick = () => $('#fImg').click();
$('#bBlank').onclick = insertBlank;
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bSave').onclick = save;
$('#cClean').onchange = e => { S.clean = e.target.checked; };
$('#bPages').onclick = () => $('#side').classList.toggle('open');
const zoomTo = z => { commitEditor(); const ratio = desk.scrollTop / Math.max(1, desk.scrollHeight); S.zoom = clamp(z, 0.25, 4); renderAll(); desk.scrollTop = ratio * desk.scrollHeight; };
$('#bZi').onclick = () => zoomTo(S.scale * 1.2);
$('#bZo').onclick = () => zoomTo(S.scale / 1.2);
$('#bFit').onclick = () => { S.zoom = 'fit'; renderAll(); };
$('#fOpen').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) openBytes(new Uint8Array(await readFile(f)), f.name); };
$('#fMerge').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (f) mergeBytes(new Uint8Array(await readFile(f))); };
$('#fImg').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) addImageFile(f); };

let dragDepth = 0;
desk.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); dragDepth++; $('#drop').hidden = false; } });
desk.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
desk.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').hidden = true; } });
desk.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) openBytes(new Uint8Array(await readFile(f)), f.name);
  else if (f.type.startsWith('image/')) addImageFile(f);
  else toast('Ese tipo de archivo no se puede usar aquí.');
});

let scrollRaf = 0;
desk.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = 0;
    const mid = desk.scrollTop + desk.clientHeight / 2; let best = 0, bd = Infinity;
    S.pages.forEach((p, i) => { const r = RT[p.id]; if (!r) return; const c = r.wrap.offsetTop + r.wrap.offsetHeight / 2; const d = Math.abs(c - mid); if (d < bd) { bd = d; best = i; } });
    setCur(best);
  });
});
let rsT;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.zoom === 'fit') renderAll(); else S.pages.forEach(drawAnnots); }, 150); });

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'textarea' || (tag === 'input' && e.target.type !== 'range')) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (mod) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Escape') { setSel(null); return; }
  if (S.sel && e.key.startsWith('Arrow')) {
    e.preventDefault(); const a = selAnn(); const p = pageById(S.sel.pid); const st = e.shiftKey ? 10 : 1;
    const v = RT[p.id].vp; const [x0, y0] = v.convertToPdfPoint(0, 0);
    const dir = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
    const [x1, y1] = v.convertToPdfPoint(dir[0] * S.scale, dir[1] * S.scale);
    const before = snap(); translateAnn(a, x1 - x0, y1 - y0); commit(before); drawAnnots(p); return;
  }
  const map = { e: 'edit', v: 'select', t: 'text', p: 'pen', h: 'hl', r: 'rect', w: 'white' };
  const k = e.key.toLowerCase();
  if (map[k]) setTool(map[k]); else if (k === 'i') $('#fImg').click();
});

  });

(async () => {
  try {
    const bytes = await makeSample();
    await openBytes(new Uint8Array(bytes), 'propuesta-ejemplo.pdf');
    const p = S.pages[0];
    p.annots.push(
      { id: nid(), type: 'hl', x1: 276, y1: 418, x2: 334, y2: 434, color: '#ffd43b' },
      { id: nid(), type: 'text', x: 168, y: 503, rot: 0, text: '¿Se puede acortar\na 4 semanas?', color: '#b4232c', size: 11 },
      { id: nid(), type: 'pen', pts: [[230, 482], [244, 468], [260, 452], [276, 438]], color: '#b4232c', size: 1.5 }
    );
    renderAll();
  } catch (e) {
    console.error(e);
    $('#loading').textContent = 'No se pudo preparar el editor. Recargá la página.';
  }
})();
})();
